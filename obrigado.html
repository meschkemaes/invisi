<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <!-- Google tag (gtag.js) -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-NJHBCVJHD8"
        ></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());
            gtag("config", "G-NJHBCVJHD8");
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#071a2b" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="styles.css" />
        <title>Solicitação recebida | Invisi</title>
        <style>
            .thanks-page {
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 40px 20px;
                color: #fff;
                background:
                    radial-gradient(
                        circle at 50% 30%,
                        rgba(30, 184, 166, 0.14),
                        transparent 30%
                    ),
                    #071a2b;
            }
            .thanks-card {
                width: min(100%, 590px);
                padding: 55px 45px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 28px;
                text-align: center;
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
            }
            .thanks-icon {
                display: grid;
                width: 72px;
                height: 72px;
                margin: 0 auto 28px;
                place-items: center;
                color: #071a2b;
                background: #31d1bd;
                border-radius: 50%;
            }
            .thanks-icon svg {
                width: 35px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
            }
            .thanks-card h1 {
                margin-bottom: 18px;
                font-size: clamp(36px, 8vw, 52px);
                letter-spacing: -2px;
            }
            .thanks-card p {
                margin: 0 auto 28px;
                color: rgba(255, 255, 255, 0.68);
            }
            .thanks-card .brand {
                justify-content: center;
                margin-bottom: 40px;
            }
        </style>
    </head>
    <body>
        <main class="thanks-page">
            <section class="thanks-card" aria-labelledby="titulo">
                <a class="brand" href="./" aria-label="Invisi, página inicial">
                    <svg
                        class="brand-mark"
                        viewBox="0 0 44 44"
                        aria-hidden="true"
                    >
                        <path
                            d="M22 3 38 9v11c0 10.4-6.5 17.2-16 21C12.5 37.2 6 30.4 6 20V9l16-6Z"
                        />
                        <path d="M14 22s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z" />
                        <circle cx="22" cy="22" r="2.5" />
                    </svg>
                    <span>invisi</span>
                </a>
                <div class="thanks-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m5 12 4 4L19 7" />
                    </svg>
                </div>
                <h1 id="titulo">Solicitação recebida.</h1>
                <p>
                    Recebemos sua solicitação. Analisaremos as informações e
                    entraremos em contato pelo e-mail informado ou pelo
                    WhatsApp, caso você o tenha preenchido. O envio não gera
                    cobrança nem contratação.
                </p>
                <a class="button" href="./">Voltar para o início</a>
            </section>
        </main>
    </body>
</html>
